[project]
name = "spriter"
version = "0.5.0"
description = "High-performance specialized repository for 2D sprites and animation sheets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "boto3>=1.42.88",
    "httpx>=0.28.1",
    "aiofiles>=25.1.0",
    "structlog>=25.5.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.26",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
]
dev = [
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "bandit>=1.9.4",
    "pre-commit>=4.5.1",
]
docs = [
    "sphinx>=9.0.4",
    "furo>=2025.12.19",
    "sphinx-autodoc-typehints>=3.6.1",
    "myst-parser>=5.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/application", 
    "src/domain", 
    "src/infrastructure", 
    "src/presentation", 
    "src/config.py", 
    "src/main.py", 
    "src/dependencies.py"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]  # Standard pytest matching
python_classes = ["Test*"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.3",
    "types-aiofiles>=25.1.0.20260409",
    "types-python-jose>=3.5.0.20260408",
    "types-requests>=2.33.0.20260408",
]

